[[items]]
title = "R²E: A Role-driven Reward Evolutionary Framework"
subtitle = "Sole first author · Accepted at NeurIPS 2026"
date = "2026"
tags = ["Reinforcement Learning", "Reward Design", "LLMs"]
content = '''
Reward design in reinforcement learning still depends on costly manual trial and error. LLM-based methods explore the reward space poorly and make training unstable, because candidates are sampled without distinction and past feedback is underused.

R²E splits the search across three LLM roles. An Explorer proposes novel rewards, a Guardian makes conservative edits that stabilize training, and an Evolver recombines strong rewards by crossover and mutation. A scheduler shifts from exploration to exploitation, and a Global Elite Pool keeps the best rewards so the roles can build on them. Experiments on tasks from Isaac Gym and Bi-DexHands show that the generated reward functions are effective.

Code: [github.com/ChangYuandao/R2E](https://github.com/ChangYuandao/R2E)

![Overview of the three roles and the Global Elite Pool](/research/r2e-overview.png)
'''
