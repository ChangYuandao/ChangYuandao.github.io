[[items]]
title = "R²E: A Role-driven Reward Evolutionary Framework"
subtitle = "Sole first author · Accepted at NeurIPS 2026"
date = "2026"
tags = ["Reinforcement Learning", "Reward Design", "LLMs"]
content = '''
Reward design in reinforcement learning still depends on costly manual trial and error. LLM-based methods explore the reward space poorly and make training unstable, because candidates are sampled without distinction and past feedback is underused.

R²E splits the search across three LLM roles. An Explorer proposes novel rewards, a Guardian makes conservative edits that stabilize training, and an Evolver recombines strong rewards by crossover and mutation. A scheduler shifts from exploration to exploitation, and a Global Elite Pool keeps the best rewards so the roles can build on them. Experiments on tasks from Isaac Gym and Bi-DexHands show that the generated reward functions are effective.

Code: [github.com/ChangYuandao/R2E](https://github.com/ChangYuandao/R2E)

![R²E compared with Eureka](/research/r2e-teaser.png)

![Overview of the three roles and the Global Elite Pool](/research/r2e-overview.png)

![Isaac Gym tasks used in the experiments](/research/isaacgym.png)
'''

[[items]]
title = "Parameter-Free Historical Visual Memory for VLA Models"
subtitle = "Ongoing · Target venue: CVPR 2027"
date = "2026"
tags = ["VLA", "Robot Learning", "Real Robot"]
content = '''
Current physical-intelligence models act on the present frame and have no visual memory across time. In tasks such as placing a bottle into a paper bag, several similar handles appear at once, and the model cannot use earlier views to choose the right one. The goal is to give vision-language-action models this memory.

The memory has to be added without hurting the original tasks. Editing the SigLIP encoder with new learnable parameters broke the existing visual-token semantics and lowered real-robot performance. Following the idea behind PI-MEM, the method leaves the architecture unchanged: the same encoder embeds the current frame and past frames, spatiotemporal attention mixes their tokens, and only the current-frame output is passed on, so the original VLA interface stays intact.

Early real-robot trials show a gain on these tasks, and simulation experiments are underway. For a VLA model, historical visual memory can be added by post-training alone, without new pretraining.
'''
