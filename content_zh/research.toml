[[items]]
title = "R²E：角色驱动的奖励进化框架"
subtitle = "唯一第一作者 · NeurIPS 2026 接收"
date = "2026"
tags = ["强化学习", "奖励设计", "大语言模型"]
content = '''
强化学习里的奖励设计仍然依赖昂贵的人工试错。基于大语言模型的方法对奖励空间探索不足，训练也不稳定，因为候选奖励不加区分地采样，历史反馈也没有被好好利用。

R²E 把搜索拆给三个角色。Explorer 提出新的奖励，Guardian 做保守修改以稳住训练，Evolver 用交叉和变异重组已经表现好的奖励。调度器把搜索从探索逐渐转到利用，Global Elite Pool 保留目前最好的奖励，供后续迭代继续改进。在 Isaac Gym 与 Bi-DexHands 的多项机器人任务上，生成的奖励函数是有效的。

代码：[github.com/ChangYuandao/R2E](https://github.com/ChangYuandao/R2E)

![R²E 与 Eureka 的对比](/research/r2e-teaser.png)

![三个角色与 Global Elite Pool](/research/r2e-overview.png)

![实验使用的 Isaac Gym 任务](/research/isaacgym.png)
'''

[[items]]
title = "面向 VLA 模型的无新增参数历史视觉记忆"
subtitle = "进行中 · 目标投稿 CVPR 2027"
date = "2026"
tags = ["VLA", "机器人学习", "真机"]
content = '''
现有的物理智能模型只根据当前帧行动，没有跨时间的视觉记忆。把瓶子放进纸袋这类任务里，画面中会同时出现几个相似的把手，模型无法借助更早的观察选出正确的那个。这项工作希望给视觉-语言-动作模型补上这种记忆。

记忆必须加进去，又不能损害原有任务。给 SigLIP 编码器增加可学习参数会破坏已有视觉 token 的语义，真机表现也会下降。受 PI-MEM 启发，这个方法不改模型结构：同一个编码器分别编码当前帧和历史帧，时空注意力混合这些 token，只把当前帧的输出继续送给语言模型，因此原来的 VLA 接口保持不变。

早期真机试验在这些任务上已有提升，仿真实验还在进行。对任意 VLA 模型，历史视觉记忆可以只通过后训练加入，不需要重新预训练。
'''
